<div class="workflow-backdrop" id="sensevoice-backdrop" hidden>

        <div class="workflow-header">

          <div class="workflow-head-status"><span class="engine-badge"><i></i> audio.cpp · SenseVoice Q8</span><div class="process-state" id="sensevoice-state"><i></i><span>等待输入</span></div></div>
        </div>
        <div class="sensevoice-canvas">
          <article class="workflow-node-card sensevoice-input-card">
            <div class="denoise-input-heading"><div><span class="node-number">01 · INPUT</span><h3>输入音频</h3></div><span class="node-type">WAV · MP3 · M4A · FLAC · OGG · OPUS · WEBM</span></div>

            <div class="audio-preview" id="sensevoice-input-player" hidden></div>

          <article class="workflow-node-card sensevoice-options-card">

            <label class="chatterbox-model-field"><span>语言</span><div class="model-select-wrap sensevoice-select-wrap"><select id="sensevoice-language" aria-hidden="true" tabindex="-1"><option value="auto">自动检测</option><option value="zh">中文</option><option value="en">英文</option><option value="yue">粤语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="pt">葡萄牙语</option><option value="ru">俄语</option><option value="es">西班牙语</option><option value="it">意大利语</option><option value="fr">法语</option><option value="de">德语</option><option value="nl">荷兰语</option><option value="pl">波兰语</option><option value="tr">土耳其语</option><option value="ar">阿拉伯语</option><option value="hi">印地语</option><option value="vi">越南语</option><option value="th">泰语</option><option value="id">印尼语</option><option value="ms">马来语</option><option value="fa">波斯语</option></select><button class="model-select-trigger" id="sensevoice-language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="sensevoice-language-label">自动检测</span><i aria-hidden="true"></i></button><div class="model-select-menu sensevoice-language-menu" id="sensevoice-language-menu" role="listbox" aria-label="选择识别语言" hidden><button type="button" role="option" aria-selected="true" data-sensevoice-language="auto"><strong>自动检测</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="zh"><strong>中文</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="en"><strong>英文</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="yue"><strong>粤语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="ja"><strong>日语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="ko"><strong>韩语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="pt"><strong>葡萄牙语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="ru"><strong>俄语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="es"><strong>西班牙语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="it"><strong>意大利语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="fr"><strong>法语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="de"><strong>德语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="nl"><strong>荷兰语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="pl"><strong>波兰语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="tr"><strong>土耳其语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="ar"><strong>阿拉伯语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="hi"><strong>印地语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="vi"><strong>越南语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="th"><strong>泰语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="id"><strong>印尼语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="ms"><strong>马来语</strong></button><button type="button" role="option" aria-selected="false" data-sensevoice-language="fa"><strong>波斯语</strong></button></div></div></label>
            <label class="parameter-toggle"><input id="sensevoice-itn" type="checkbox" checked><span>数字与文本规范化</span></label>
            <label class="parameter-toggle"><input id="sensevoice-tags" type="checkbox"><span>保留情绪与事件标签</span></label>
          </article>
          <article class="workflow-node-card sensevoice-output-card">
            <div class="sensevoice-output-heading"><div><span class="node-number">03 · TRANSCRIPT</span><h3>识别文本</h3></div><div class="sensevoice-output-actions"><button class="text-button" id="sensevoice-copy" disabled>复制</button><button class="text-button" id="sensevoice-download" disabled>下载 TXT ↗</button></div></div>
            <textarea id="sensevoice-transcript" readonly placeholder="识别结果会显示在这里…"></textarea>
          </article>
        </div>
        <div class="workflow-footer sensevoice-footer"><div class="progress-area"><div class="progress-copy"><span id="sensevoice-progress-message">准备就绪</span><b id="sensevoice-progress-percent">0%</b></div><div class="progress-track"><i id="sensevoice-progress-bar"></i></div></div><div class="workflow-actions"><button class="secondary-button" id="sensevoice-cancel">取消</button><button class="primary-button" id="sensevoice-run" disabled>开始识别</button></div></div>
      </section>
